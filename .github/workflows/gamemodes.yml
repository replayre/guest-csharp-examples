name: gamemodes

on:
  push:
    branches: [main]
    paths:
      - "gamemodes/**"
      - ".github/workflows/gamemodes.yml"
  workflow_dispatch:

concurrency:
  group: gamemodes-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.400

      # pnpm must be installed before setup-node so its pnpm cache can resolve
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: gamemodes/ui/pnpm-lock.yaml

      - name: Build wasm blobs
        working-directory: gamemodes
        run: dotnet build -c Release

      - name: Install UI dependencies
        working-directory: gamemodes/ui
        run: pnpm install --frozen-lockfile

      - name: Build UI
        working-directory: gamemodes/ui
        run: pnpm build

      - name: Verify dist contents
        working-directory: gamemodes
        run: |
          set -euo pipefail
          echo "dist/ contents:"
          find dist -maxdepth 2 -printf '%y %p\n'

          missing=0
          for f in config.toml cl.wasm sv.wasm ui/index.html; do
            if [[ ! -f "dist/$f" ]]; then
              echo "::error::expected dist/$f to exist after build"
              missing=1
            fi
          done
          exit "$missing"

      - name: Package archives
        working-directory: gamemodes
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          OUT="$RUNNER_TEMP/out"
          rm -rf "$STAGE" "$OUT"
          mkdir -p "$STAGE/gamemodes" "$OUT"

          cp -a dist/. "$STAGE/gamemodes/"

          (cd "$STAGE" && zip -qr "$OUT/gamemodes.zip" gamemodes)
          (cd "$STAGE" && tar czf "$OUT/gamemodes.tar.gz" gamemodes)

          ls -lh "$OUT"
          echo "--- zip ---"
          unzip -l "$OUT/gamemodes.zip"
          echo "--- tar ---"
          tar tzf "$OUT/gamemodes.tar.gz"

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Rolling `gamemodes` bundle build.

            - commit: ${{ github.sha }}
            - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Extract into your server's `data/ugc/` directory.
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          TAG=latest

          # Move the tag to the commit this bundle was built from
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT/gamemodes.zip" "$OUT/gamemodes.tar.gz" --clobber
            gh release edit "$TAG" --title "gamemodes" --notes "$NOTES"
          else
            gh release create "$TAG" "$OUT/gamemodes.zip" "$OUT/gamemodes.tar.gz" \
              --verify-tag --title "gamemodes" --notes "$NOTES"
          fi
